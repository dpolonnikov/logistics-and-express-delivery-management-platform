- changeSet:
    id: create-table-users-1
    author: dmitry.polonnikov
    comment: first liquibase migration
    changes:
      - createTable:
          tableName: users
          columns:
            - column:
                name: id
                type: uuid
                autoIncrement: false
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: email
                type: varchar(50)
                constraints:
                  nullable: false
            - column:
                name: password
                type: varchar(256)
                constraints:
                  nullable: false
            - column:
                name: phone
                type: varchar(20)
                constraints:
                  nullable: false
            - column:
                name: role
                type: varchar(20)
                constraints:
                  nullable: false
            - column:
                name: created_at
                type: timestamp with time zone
                defaultValueComputed: CURRENT_TIMESTAMP
                constraints:
                  nullable: false
            - column:
                name: updated_at
                type: timestamp with time zone
                defaultValueComputed: CURRENT_TIMESTAMP
                constraints:
                  nullable: false
            - column:
                name: version
                type: bigint
                defaultValueNumeric: 0
                constraints:
                  nullable: false