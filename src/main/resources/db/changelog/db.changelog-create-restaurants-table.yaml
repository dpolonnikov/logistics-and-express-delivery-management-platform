- changeSet:
    id: create-table-restaurants-1
    author: dmitry.polonnikov
    comment: first liquibase migration
    changes:
      - createTable:
          tableName: restaurants
          columns:
            - column:
                name: id
                type: uuid
                autoIncrement: false
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: name
                type: varchar(50)
                constraints:
                  nullable: false
            - column:
                name: address
                type: varchar(255)
                constraints:
                  nullable: false
            - column:
                name: description
                type: text
                constraints:
                  nullable: false
            - column:
                name: is_active
                type: bool
                defaultValueComputed: true
                constraints:
                  nullable: false
            - column:
                name: created_at
                type: timestamp with time zone
                defaultValueComputed: CURRENT_TIMESTAMP
                constraints:
                  nullable: false
            - column:
                name: updated_at
                type: timestamp with time zone
                defaultValueComputed: CURRENT_TIMESTAMP
                constraints:
                  nullable: false
            - column:
                name: version
                type: bigint
                defaultValueNumeric: 0
                constraints:
                  nullable: false
